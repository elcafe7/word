# Unit tests on every pull request and every push to main (OpenSSF Best
# Practices test_continuous_integration). A failing test fails the job.
#
# Matches the commands in the release workflow: npm ci from the committed
# lockfile, npm run data, npm test (Vitest), and scripts/test_build_data.py.
# Free tools only. Every action is pinned to a full commit SHA.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies from package-lock.json
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build data and run unit tests
        run: |
          npm run data
          npm test
          python3 -m unittest scripts/test_build_data.py
